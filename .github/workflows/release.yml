name: 'Release'

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Get version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(bundle exec rake vox:version:current)
          echo "Version: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: get_version
    uses: OpenVoxProject/shared-actions/.github/workflows/release.yml@main
    with:
      version: ${{ needs.get_version.outputs.version }}
      include_changelog_in_release: true
    secrets:
      github_pat: ${{ secrets.OPENVOXBOT_COMMIT_AND_PRS }}
      ssh_private_key: ${{ secrets.OPENVOXBOT_SSH_PRIVATE_KEY }}

  build:
    needs:
      - get_version
      - release
    strategy:
      matrix:
        include:
          - project_name: agent-runtime-main
            branch: main
          - project_name: agent-runtime-8.x
            branch: '8.x'
          - project_name: openbolt-runtime
            branch: main
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.get_version.outputs.version }}
      project_name: ${{ matrix.project_name }}
      branch: ${{ matrix.branch }}
    secrets: inherit
