---
name: Runtime tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: development

jobs:
  vanagon_inspect:
    name: Vanagon inspect
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.inspect.outputs.build_matrix }}
    steps:
      - name: Checkout current PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Ruby version 4.0
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: 4.0
          bundler-cache: true
      - name: Run rubocop
        run: bundle exec rake rubocop
      - name: Vanagon inspect
        id: inspect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bundle exec rake "vox:inspect[${BASE_SHA}]"

  build:
    needs: vanagon_inspect
    if: needs.vanagon_inspect.outputs.build_matrix != '[]'
    name: build ${{ matrix.project_name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.vanagon_inspect.outputs.build_matrix) }}
    uses: 'openvoxproject/shared-actions/.github/workflows/build_vanagon.yml@main'
    with:
      project_name: ${{ matrix.project_name }}
      platform_list: ${{ matrix.platform_list }}
      vanagon_branch: main
      upload_to_s3: false

  tests:
    if: always()
    needs:
      - vanagon_inspect
      - build
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: build
